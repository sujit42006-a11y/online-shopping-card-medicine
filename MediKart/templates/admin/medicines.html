{% extends "base.html" %}{% block content %}<section class="container section"><h1>Manage Medicines</h1><div class="card"><form method="post" class="adminform"><input name="name" placeholder="Medicine name" required><input name="brand" placeholder="Brand" required><input name="generic_name" placeholder="Generic name"><select name="category_id">{% for c in categories %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select><input name="price" type="number" step=".01" placeholder="Price" required><input name="discount" type="number" step=".01" value="0"><input name="stock" type="number" value="0"><input name="pack_size" placeholder="Pack size"><input name="manufacturer" placeholder="Manufacturer"><textarea name="description" placeholder="Description"></textarea><label><input type="checkbox" name="prescription_required"> Prescription required</label><button class="btn">Add Medicine</button></form></div><div class="tablewrap"><table><tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Active</th><th></th></tr>{% for m in medicines %}<tr><td>{{m.name}}</td><td>{{m.category_name}}</td><td>{{m.price}}</td><td>{{m.stock}}</td><td>{{m.is_active}}</td><td><form method="post" action="/admin/medicines/{{m.id}}/toggle"><button class="btn small">Toggle</button></form></td></tr>{% endfor %}</table></div></section>{% endblock %}
