{% extends "base.html" %}{% block content %}<section class="container section"><h1>Orders</h1><div class="tablewrap"><table><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th>Update</th></tr>{% for o in orders %}<tr><td>{{o.order_number}}</td><td>{{o.customer}}</td><td>₹{{o.total}}</td><td>{{o.status}}</td><td><form method="post"><input type="hidden" name="order_id" value="{{o.id}}"><select name="status">{% for s in ['Pending','Prescription Verification','Confirmed','Packed','Shipped','Out for Delivery','Delivered','Cancelled'] %}<option {% if s==o.status %}selected{% endif %}>{{s}}</option>{% endfor %}</select><button class="btn small">Save</button></form></td></tr>{% endfor %}</table></div></section>{% endblock %}
