{% extends "base.html" %}{% block content %}<section class="container section"><h1>Prescription Verification</h1><div class="tablewrap"><table><tr><th>User</th><th>File</th><th>Status</th><th>Action</th></tr>{% for p in prescriptions %}<tr><td>{{p.user_name}}<br>{{p.email}}</td><td><a href="/uploads/prescriptions/{{p.filename}}" target="_blank">{{p.original_name}}</a></td><td>{{p.status}}</td><td>{% if p.status=='Pending' %}<form class="inline" method="post" action="/admin/prescriptions/{{p.id}}/approve"><button class="btn small">Approve</button></form><form class="inline" method="post" action="/admin/prescriptions/{{p.id}}/reject"><button class="btn danger small">Reject</button></form>{% endif %}</td></tr>{% endfor %}</table></div></section>{% endblock %}
